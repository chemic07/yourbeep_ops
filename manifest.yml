services:
  gateway:
    image: rajlodhi09/yourbeep:gateway-3064b4c06fa6e6b4d602eb8a44b82fc32a5de2ba
    container_name: yourbeep-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env

  identity:
    image: rajlodhi09/yourbeep:identity-3064b4c06fa6e6b4d602eb8a44b82fc32a5de2ba
    container_name: yourbeep-identity
    restart: unless-stopped
    ports:
      - "4001:4001"
    env_file:
      - .env

  content:
    image: rajlodhi09/yourbeep:content-3064b4c06fa6e6b4d602eb8a44b82fc32a5de2ba
    container_name: yourbeep-content
    restart: unless-stopped
    ports:
      - "4002:4002"
    env_file:
      - .env

  commerce:
    image: rajlodhi09/yourbeep:commerce-3064b4c06fa6e6b4d602eb8a44b82fc32a5de2ba
    container_name: yourbeep-commerce
    restart: unless-stopped
    ports:
      - "4003:4003"
    env_file:
      - .env

# Atlas is used as the production database.
# Set MONGODB_URI_IDENTITY, MONGODB_URI_CONTENT, and MONGODB_URI_COMMERCE
# in the deployment environment instead of running a local mongo container.
